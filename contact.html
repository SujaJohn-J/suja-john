<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact Suja John about data science, research, and collaboration." />
  <title>Contact | Suja John</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #111a2e;
      --text: #edf2ff;
      --muted: #aab6d3;
      --accent: #79f2c0;
      --accent-2: #8bdcff;
      --border: rgba(173, 195, 235, .18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      background: radial-gradient(ellipse at top, #172747 0%, var(--bg) 58%);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    .card {
      width: min(100%, 680px);
      padding: clamp(28px, 6vw, 54px);
      background: rgba(17, 26, 46, .92);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .25);
    }
    .kicker {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: .82rem;
      font-weight: 750;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 14px; font-size: clamp(2rem, 6vw, 3.25rem); line-height: 1.12; }
    .intro { margin: 0 0 28px; color: var(--muted); }
    .email-label { margin: 0 0 8px; color: var(--muted); font-size: .92rem; }
    .email-link {
      display: inline-block;
      max-width: 100%;
      color: var(--accent-2);
      font-size: clamp(1.05rem, 3.5vw, 1.4rem);
      font-weight: 700;
      overflow-wrap: anywhere;
      text-decoration-thickness: 2px;
      text-underline-offset: 5px;
    }
    .email-link:hover { color: var(--accent); }
    .hint { margin: 16px 0 30px; color: var(--muted); font-size: .9rem; }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      font-weight: 650;
    }
    .back:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <main class="card">
    <p class="kicker">Let’s connect</p>
    <h1>Contact Suja John</h1>
    <p class="intro">For data science opportunities, research, collaboration, or other professional enquiries, feel free to email me.</p>
    <p class="email-label">My email address</p>
    <a class="email-link" href="mailto:sujajohn2605@gmail.com?subject=Portfolio%20Enquiry&body=Hello%20Suja%2C">sujajohn2605@gmail.com</a>
    <p class="hint">Click the email address to open Outlook or another email app configured on your device.</p>
    <a class="back" href="./index.html">← Back to portfolio</a>
  </main>
</body>
</html>
